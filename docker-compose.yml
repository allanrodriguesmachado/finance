services:
  postgres:
    image: postgres:17
    container_name: finance_postgresql
    restart: unless-stopped

    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance_admin

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
      image: dpage/pgadmin4:latest
      container_name: finance-pgadmin
      restart: unless-stopped

      environment:
        PGADMIN_DEFAULT_EMAIL: admin@finance.com
        PGADMIN_DEFAULT_PASSWORD: admin123

      ports:
        - "5050:80"

      depends_on:
        - postgres

volumes:
  postgres_data: